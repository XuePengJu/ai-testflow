# Nginx 反代配置（可选）
# 用法：放到 /www/server/panel/vhost/nginx/ai-testflow.conf（宝塔）或 /etc/nginx/conf.d/
# 场景：后端经 Cloudflare 隧道暴露时，隧道可直接指向 127.0.0.1:8000，本文件可省略；
#       若你另购域名并走备案，用本文件把域名反代到后端（Cloudflare 橙云亦同）。
server {
    listen 80;
    server_name ai-testflow-api.your-domain.com;   # 改成你的后端域名

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;     # 生成用例/导出可能耗时，放宽超时
    }
}
